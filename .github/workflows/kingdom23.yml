name: Kingdom 23 - Global Travel eSIM Atlas

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kingdom23-global-travel-esim-atlas
  cancel-in-progress: false

jobs:
  build-audit-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build and audit Kingdom23 only
        working-directory: kingdom23
        run: |
          python -m py_compile validate_data.py build.py audit_build.py
          python build.py
          python audit_build.py
          test -s dist.staging-quality/index.html
          test -s dist.staging-quality/sitemap.xml
          test -s dist.staging-quality/robots.txt

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          CODE=$(curl --silent --show-error --output /tmp/cf-token.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)
          echo "Cloudflare token verification HTTP: $CODE"
          python - <<'PYTOKEN'
          import json
          d = json.load(open("/tmp/cf-token.json", encoding="utf-8"))
          if not d.get("success") or d.get("result", {}).get("status") != "active":
              raise SystemExit("Cloudflare token verification failed.")
          print("Cloudflare token is active.")
          PYTOKEN

      - name: Diagnose Cloudflare Pages account access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          CODE=$(curl --silent --show-error --output /tmp/cf-pages.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects")
          echo "Cloudflare Pages list HTTP: $CODE"
          python - <<'PYDIAG'
          import json
          d = json.load(open("/tmp/cf-pages.json", encoding="utf-8"))
          print("API success:", d.get("success"))
          print("API errors:", d.get("errors"))
          if d.get("success"):
              for project in d.get("result", []):
                  print("Existing Pages project:", project.get("name"))
          PYDIAG

      - name: Ensure Kingdom23 Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          CODE=$(curl --silent --show-error --output /tmp/cf-pages-projects.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects")
          echo "Cloudflare Pages list HTTP: $CODE"
          python - <<'PYPROJECT'
          import json
          from pathlib import Path
          d = json.loads(Path("/tmp/cf-pages-projects.json").read_text(encoding="utf-8"))
          if not d.get("success"):
              raise SystemExit("Unable to verify Cloudflare Pages projects: " + str(d.get("errors")))
          names = {p.get("name") for p in d.get("result", [])}
          if "global-travel-esim-atlas" in names:
              print("Kingdom23 Pages project already exists; creation skipped.")
          else:
              print("Kingdom23 Pages project does not exist; it will be created.")
              Path("/tmp/kingdom23-create-project").write_text("create", encoding="utf-8")
          PYPROJECT
          if [ -f /tmp/kingdom23-create-project ]; then
            npx --yes wrangler@4 pages project create global-travel-esim-atlas --production-branch main
          fi

      - name: Deploy Kingdom23 to Cloudflare Pages
        working-directory: kingdom23
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy dist.staging-quality \
            --project-name global-travel-esim-atlas \
            --branch main \
            --commit-dirty=true
